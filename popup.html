<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时光库</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="head">
      <img class="logo" src="icons/icon48.png" alt="">
      <div class="brand">
        <strong>时光库</strong>
        <span id="repoLabel">Richfull66/shiguang</span>
      </div>
      <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.47.47 0 0 0-.47-.4h-3.84a.47.47 0 0 0-.47.4l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.13.22.39.3.59.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.24.4.47.4h3.84c.23 0 .42-.16.47-.4l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96c.2.08.46 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
        </svg>
      </button>
    </header>

    <div id="statusBar" class="status">正在读取当前页面…</div>

    <section class="preview" id="previewCard" hidden>
      <div class="page-title" id="pageTitle"></div>
      <div class="stats">
        <div class="stat"><b id="selCount">0</b><span>选中文字</span></div>
        <div class="stat"><b id="imgCount">0</b><span>页面图片</span></div>
      </div>
    </section>

    <div class="actions">
      <button id="saveSelection" class="btn primary" disabled>保存选中内容</button>
      <button id="savePage" class="btn secondary" disabled>保存整个页面</button>
    </div>

    <section id="progressWrap" class="progress" hidden>
      <div class="bar"><div id="barFill"></div></div>
      <div id="progressText" class="progress-text">准备中…</div>
    </section>

    <section id="resultWrap" class="result" hidden>
      <div id="resultTitle" class="result-title"></div>
      <div id="resultMeta" class="result-meta"></div>
      <div class="result-actions">
        <a id="resultLink" href="#" target="_blank" rel="noreferrer">在 GitHub 查看</a>
        <button id="copyBtn" class="link-btn" type="button">复制链接</button>
      </div>
    </section>

    <footer class="foot">
      <a id="repoLink" href="https://github.com/Richfull66/shiguang" target="_blank" rel="noreferrer">打开仓库</a>
      <span class="dot">·</span>
      <button id="optionsLink" class="link-btn" type="button">设置</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
